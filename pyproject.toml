[project]
name = "truck-driver-analytics"
version = "0.1.0"
description = "Embedded driver behavior analytics (DMS/ADAS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
edge = [
  "mediapipe>=0.10.9",
  "onnxruntime>=1.16",
]
yolo = [
  "ultralytics>=8.1",
]
fleet = [
  "fastapi>=0.109",
  "uvicorn[standard]>=0.27",
  "httpx>=0.26",
  "pydantic>=2.5",
  "pydantic-settings>=2.1",
  "aiosqlite>=0.19",
  "python-multipart>=0.0.6",
  "pyzmq>=25.0",
]
dev = ["pytest>=7.4", "ruff>=0.1"]
can = ["python-can>=4.3"]
gps = ["pynmea2>=1.19"]
# Placa embarcada (EAI-Nano-TB): sem PyTorch/Ultralytics por padrão
# Placa ARM sem LSE (ex.: RV1126B): sem MediaPipe — use gravação + ADAS leve
embedded = [
  "onnxruntime>=1.16",
  "httpx>=0.26",
]
mediapipe = [
  "mediapipe>=0.10.9",
]

[project.scripts]
tda-run = "edge.main:main"
tda-benchmark-capture = "edge.capture.benchmark:main"
tda-replay = "tools.replay.replay_session:main"
tda-gateway = "edge.gateway_stm32.service:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["edge*", "backend*", "tools*", "models*"]
